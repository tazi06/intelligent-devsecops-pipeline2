name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          python -m pip install --upgrade semgrep
          semgrep scan --config auto --error app/
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: app/
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
    
      - name: Install Cloudflare Security Audit Skill
        run: |
          npx -y skills add https://github.com/cloudflare/security-audit-skill \
            --skill security-audit \
            -a opencode \
            -y

          echo "=== Installed Skills ==="
          npx -y skills list

          echo "=== Searching for Security Audit Skill ==="
          find . -type f -path "*/security-audit/SKILL.md" -print

            - name: Verify Cloudflare Skill
        run: |
          test -s .agents/skills/security-audit/SKILL.md
          echo "Cloudflare Security Audit Skill verified successfully"

