name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          python -m pip install --upgrade semgrep
          semgrep scan --config auto --error app/
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: app/
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
    

  opencode-test:
    name: OpenCode + Cloudflare Security Audit Skill
    runs-on: ubuntu-latest

    env:
      KAGGLE_API_KEY: ${{ secrets.KAGGLE_API_KEY }}
      KAGGLE_BASE_URL: ${{ secrets.KAGGLE_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenCode V2
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify OpenCode
        run: |
          opencode --version

      - name: Verify OpenCode
        run: opencode --version

      - name: Install Cloudflare Security Audit Skill
        run: |
          npx -y skills add https://github.com/cloudflare/security-audit-skill \
            --skill security-audit \
            -a opencode \
            -y

      - name: Verify Cloudflare Skill
        run: |
          test -s .agents/skills/security-audit/SKILL.md
          echo "Cloudflare Security Audit Skill verified successfully"

 
      - name: Debug Kaggle Endpoint
        run: |
          echo "=== OpenCode Version ==="
          opencode --version

          echo "=== Normalize API URL ==="
          API_BASE="${KAGGLE_BASE_URL%/}"
          case "$API_BASE" in
            */v1) ;;
            *) API_BASE="$API_BASE/v1" ;;
          esac

          echo "API endpoint: $API_BASE"

          echo "=== Kaggle Models API ==="
          curl -sS --max-time 30 \
            -H "Authorization: Bearer $KAGGLE_API_KEY" \
            "$API_BASE/models" \
            -o /tmp/models.json \
            -w "HTTP Status: %{http_code}\n"

          python3 -m json.tool /tmp/models.json

          echo "=== Extract Model ID ==="
          MODEL_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/models.json"))["data"][0]["id"])')

          echo "Actual model ID: $MODEL_ID"

     
 
      
      - name: Diagnose Kaggle Qwen
        shell: bash
        run: |
          set -e

          API_BASE="${KAGGLE_BASE_URL%/}"
          case "$API_BASE" in
            */v1) ;;
            *) API_BASE="$API_BASE/v1" ;;
          esac

          MODEL_ID="/root/.cache/huggingface/hub/models--Qwen--Qwen2.5-Coder-7B-Instruct/snapshots/c03e6d358207e414f1eca0bb1891e29f1db0e242"

          echo "=== Direct Kaggle Inference ==="
          HTTP_CODE=$(curl -sS --max-time 120 \
            -H "Authorization: Bearer $KAGGLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(MODEL_ID="$MODEL_ID" python3 -c 'import os,json; print(json.dumps({"model":os.environ["MODEL_ID"],"messages":[{"role":"user","content":"Reply exactly CONNECTION_SUCCESS"}],"temperature":0}))')" \
            "$API_BASE/chat/completions" \
            -o /tmp/kaggle-response.json \
            -w "%{http_code}")

          echo "Direct API HTTP: $HTTP_CODE"
          cat /tmp/kaggle-response.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Direct Kaggle inference failed"
            exit 1
          fi

          echo "=== OpenCode Inference ==="
          opencode run \
            --standalone \
            --print-logs \
            --log-level debug \
            --model kaggle/qwen2.5-coder-7b \
            'Reply with exactly: CONNECTION_SUCCESS'


